<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  :root{color-scheme:light dark;--paper:#f4efe2;--ink:#182126;--brass:#b3863d;--blue:#1e5266;--muted:#687278;--danger:#9d3b31}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif}
  .card{padding:20px;border:1px solid var(--brass)}.eyebrow{font:700 11px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}h1{font:700 25px Georgia,serif;margin:8px 0 6px}.note{color:var(--muted);line-height:1.45}.review{margin:17px 0;padding:14px;border-block:1px solid color-mix(in srgb,var(--brass) 55%,transparent);font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.buttons{display:flex;gap:10px;justify-content:flex-end}button{padding:10px 15px;border:1px solid var(--brass);background:transparent;color:inherit;font-weight:700;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.status{font-weight:700;margin:12px 0 0}@media(prefers-color-scheme:dark){:root{--paper:#141b1f;--ink:#eee8dc;--brass:#cf9f50;--blue:#397f98;--muted:#a6afb2}}
</style></head>
<body><section class="card"><div class="eyebrow">Explicit confirmation required</div><h1>Review Every Street action</h1><p class="note">Nothing has changed yet. The signed action expires in ten minutes and can be used only once.</p><div class="review" id="review"></div><div class="buttons"><button id="cancel" type="button">Cancel</button><button class="primary" id="confirm" type="button">Confirm action</button></div><p class="status" id="status" aria-live="polite"></p></section>
<script>
  const output=window.openai?.toolOutput||{};const envelope=window.openai?.toolResponseMetadata||{};const hidden=envelope?.mcp_tool_result?._meta||envelope?.call_tool_result?._meta||envelope?._meta||{};const preview=output.preview||{};
  document.getElementById('review').textContent=`Action: ${preview.action||'Unknown'}\n\n${JSON.stringify(preview.arguments||{},null,2)}`;
  document.getElementById('cancel').addEventListener('click',()=>window.openai?.requestClose?.());
  document.getElementById('confirm').addEventListener('click',async()=>{const button=document.getElementById('confirm');const status=document.getElementById('status');if(!hidden.action_token){status.textContent='The signed action token is unavailable. Ask ChatGPT to prepare the action again.';return}button.disabled=true;status.textContent='Applying reviewed action…';try{const result=await window.openai.callTool('commit_every_street_action',{action_token:hidden.action_token});const payload=result?.structuredContent||result?.structured_content||result||{};if(payload.success===false)throw new Error('Action was not applied');status.textContent='Action applied successfully.';button.textContent='Applied';window.openai?.sendFollowUpMessage?.({prompt:'The reviewed Every Street action was applied. Summarize the result and suggest the next useful step.',scrollToBottom:true})}catch(error){button.disabled=false;status.textContent=error?.message||'The action could not be applied.'}});
</script></body></html>
